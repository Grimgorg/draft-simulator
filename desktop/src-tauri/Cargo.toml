[package]
name = "draft-simulator"
version = "0.0.0" # unused: the app's version comes from the root package.json (tauri.conf.json)
description = "Desktop app for Draft Simulator: runs the server and shows its management UI."
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.5"
serde_json = "1"
tauri-plugin-updater = "2.14"

version: 2

# Weekly update pull requests into dev, the beta channel: minor and patch
# updates grouped into one per ecosystem, majors one each. CI's audit job
# fails while a known vulnerability is unfixed, so these are also how a new
# advisory gets fixed. Dependabot's own security updates stay off: they'd go
# straight into main, around dev.
#
# A Dependabot pull request can't pass CI as it is: it doesn't bump the
# version, and its runs get no repository secrets, so the package jobs can't
# sign. Before merging one, push a version bump to its branch
# (npm version prerelease --preid beta --no-git-tag-version, see
# DEVELOPMENT.md): the run that starts is yours, with the secrets.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  # Keeps the commit SHAs the workflows pin their actions to up to date.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]

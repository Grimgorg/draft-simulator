name: CI

# Every push to any branch runs the tests, lints the desktop app's Rust code
# and checks that the version in the root package.json is higher than the
# latest GitHub Release. A push to main (a merged pull request) then builds
# the desktop app for every platform and publishes its installers as Release
# v<version>, but only once all of that has passed. A manual run (Actions →
# CI → Run workflow) builds and smoke-tests them without releasing them.
#
# The version check on a feature branch is what stops a pull request without
# a version bump. It only blocks the merge if main has a branch rule that
# requires the "test" and "version" checks (Settings → Rules). Without it the
# merge goes through and the run on main fails instead, with no release.
# Releasing needs no secrets: the jobs that write ask for contents: write.
#
# Jobs never hand files to each other as workflow artifacts: artifact storage
# is a quota shared by every private repo on the account, and other repos
# filling it once failed a release here. The card cache travels through
# actions/cache (a separate per-repo limit) and each package job uploads its
# installers straight to the Release, whose files don't count toward the quota.
# No pull_request trigger: a pull request shows its branch's push checks, and
# running both would test every pull request twice. No tags either, so the tag
# a release creates doesn't start another run.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels an older run on the same branch, except on main, where
# that would leave a release half-published. GitHub still keeps only one
# waiting run per branch: if three merges land during one run, the middle one
# gets no release of its own, and the next release includes its changes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "24"
  # Collects the Rust crates' licenses for THIRD_PARTY_NOTICES.txt. Pinned, so
  # a new release can't change what the build accepts.
  CARGO_ABOUT_VERSION: "0.9.2"

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      card-cache-key: ${{ steps.card-cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The socket integration tests, the browser tests and the executable
      # smoke tests resolve cards against the Scryfall card cache. Download
      # it at most once a week instead of on every run. Bump the version after
      # a card DB schema change, so tests don't run against a cache without it.
      - name: Compute card cache key
        id: card-cache-key
        shell: bash
        run: echo "key=cards-v2-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore card cache
        id: card-cache
        uses: actions/cache@v6
        with:
          path: server/data/cards.sqlite3
          key: ${{ steps.card-cache-key.outputs.key }}
          # Lets the Windows package job restore the cache saved here on Linux.
          enableCrossOsArchive: true
      - name: Download card cache
        if: steps.card-cache.outputs.cache-hit != 'true'
        run: npm run import-cards --workspace server

      - run: npm run build:shared
      - run: npm run typecheck --workspace server
      - run: npm run typecheck --workspace e2e
      - run: npm run lint --workspace client
      - run: npm run build --workspace server
      - run: npm run build --workspace client

      # node --test reports "tests 0" and still exits 0 when it finds no
      # test files (e.g. on an older Node), so check that tests actually ran.
      - name: Server tests
        shell: bash
        run: |
          npm test 2>&1 | tee test-output.txt
          if ! grep -Eq "^ℹ tests [1-9]" test-output.txt; then
            echo "::error::npm test ran no tests"
            exit 1
          fi

      - run: npx --workspace e2e playwright install --with-deps chromium
      - run: npm run test:e2e
      # Only uploaded when the browser tests fail. A full artifact quota
      # (see the top of this file) mustn't hide the real failure.
      - name: Upload browser test report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # The desktop app is only built on main, so a feature branch checks here
  # that its Rust code compiles cleanly. tauri.conf.json alone needs no
  # server executable: the bundle-only settings that do are in
  # tauri.bundle.conf.json, which only the package jobs use.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace desktop
      - name: Install the Linux libraries Tauri builds against
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      # Fails when a crate's license isn't in about.toml's accepted list, so a
      # new dependency's license is checked here rather than at release time.
      # rust-cache keeps ~/.cargo/bin, so this only compiles on a cache miss.
      # The version goes in as an expression, not $CARGO_ABOUT_VERSION: on
      # Windows run steps use PowerShell, where that came out empty.
      - run: cargo install --locked --features cli "cargo-about@${{ env.CARGO_ABOUT_VERSION }}"
      - name: Check the Rust crates' licenses
        working-directory: desktop/src-tauri
        run: cargo about generate --fail --locked --config about.toml --manifest-path Cargo.toml about.hbs > /dev/null

  # Compares against the highest published release, not the previous commit:
  # a merge that forgot the bump must fail even if an older commit had one.
  # Only plain X.Y.Z versions, which sort -V orders correctly.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version was increased
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version in package.json (\"$version\") must look like 1.2.3."
            exit 1
          fi

          # Fetched on its own line so a failed API call fails the step
          # instead of looking like a repo without releases.
          tags=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName')
          latest=$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1 || true)

          if [ -n "$latest" ]; then
            highest=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)
            if [ "$version" = "$latest" ] || [ "$highest" != "$version" ]; then
              echo "::error::Version $version in package.json is not higher than the latest release v$latest. Bump it with: npm version patch --no-git-tag-version"
              exit 1
            fi
            echo "Version $version is higher than the latest release v$latest."
          else
            echo "No release yet; version $version will be the first."
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  # Created as a draft so nobody sees a half-filled release; publish-release
  # makes it public once every executable is attached. Publishing it creates
  # the tag on the merged commit.
  create-release:
    needs: [test, desktop, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # "Re-run all jobs" after a failed package job finds the draft from the
      # first attempt; reuse it instead of failing on the existing release.
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" = "true" ]; then
              echo "Reusing the draft release $TAG."
              exit 0
            fi
            echo "::error::Release $TAG is already published."
            exit 1
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --generate-notes

  package:
    needs: [test, desktop, version, create-release]
    # create-release is skipped on a manual run; still build then.
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.desktop.result == 'success' &&
      (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch')
    # The server executable is a copy of the runner's own Node binary, and the
    # desktop app wraps it, so every platform is built on that platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            bundles: appimage,deb
          - os: windows-latest
            target: windows-x64
            bundles: nsis
          # "app" too: built only as a step towards the dmg, the .app is
          # deleted afterwards, and the smoke test below needs it.
          - os: macos-latest
            target: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            target: macos-x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:exe

      - name: Restore card cache
        id: card-cache
        uses: actions/cache/restore@v6
        with:
          path: server/data/cards.sqlite3
          key: ${{ needs.test.outputs.card-cache-key }}
          enableCrossOsArchive: true
      # Only if the cache was evicted between the jobs.
      - name: Download card cache
        if: steps.card-cache.outputs.cache-hit != 'true'
        run: npm run import-cards --workspace server

      - name: Smoke-test the executable
        shell: bash
        run: |
          exe="release/draft-simulator-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          npm run smoke-test-exe --workspace server -- "$exe" server/data/cards.sqlite3

      - name: Install the Linux libraries Tauri builds against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo install --locked --features cli "cargo-about@${{ env.CARGO_ABOUT_VERSION }}"
      # The server's notices from build:exe plus the Rust crates' licenses.
      - run: npm run notices --workspace desktop
      # build:exe already put the executable where the desktop app bundles it.
      - name: Build the desktop app
        run: npm run build --workspace desktop -- --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}

      # Tauri signs the server again when it bundles it. Signed with the
      # hardened runtime, V8 couldn't reserve memory and the server crashed
      # at start, while the executable tested above was fine.
      - name: Smoke-test the server inside the app (macOS)
        if: runner.os == 'macOS'
        run: npm run smoke-test-exe --workspace server -- "desktop/src-tauri/target/release/bundle/macos/Draft Simulator.app/Contents/MacOS/draft-simulator-server" server/data/cards.sqlite3

      # Renamed to names without spaces or version, like the old downloads.
      # THIRD_PARTY_NOTICES.txt is inside every installer; it's also attached
      # on its own, once.
      - name: Collect the installers
        shell: bash
        env:
          BUNDLE: desktop/src-tauri/target/release/bundle
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release/upload
          case "$RUNNER_OS" in
            Linux)
              cp "$BUNDLE"/appimage/*.AppImage "release/upload/draft-simulator-$TARGET.AppImage"
              cp "$BUNDLE"/deb/*.deb "release/upload/draft-simulator-$TARGET.deb"
              cp desktop/src-tauri/THIRD_PARTY_NOTICES.txt release/upload/
              ;;
            Windows) cp "$BUNDLE"/nsis/*-setup.exe "release/upload/draft-simulator-$TARGET-setup.exe" ;;
            macOS) cp "$BUNDLE"/dmg/*.dmg "release/upload/draft-simulator-$TARGET.dmg" ;;
          esac
          ls -l release/upload

      # --clobber, so re-running a failed job replaces a partial upload.
      - name: Attach to the release
        if: needs.create-release.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" release/upload/* --clobber

  publish-release:
    needs: [version, create-release, package]
    if: needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

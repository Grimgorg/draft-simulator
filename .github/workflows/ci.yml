name: CI

# A pull request into main, and every new push to it, runs the tests, lints
# the desktop app's Rust code, checks that the version in the root
# package.json is higher than the latest GitHub Release, and builds and
# smoke-tests the desktop app for every platform without releasing it. A push
# to main (a merged pull request) runs the same, then publishes the
# installers as Release v<version>, but only once all of that has passed. A
# manual run (Actions → CI → Run workflow) builds and smoke-tests them without
# releasing them.
#
# dev is the beta channel and runs the same way: a pull request into dev, a
# push to it and a manual run on it build "Draft Simulator Beta"
# (tauri.beta.conf.json: its own name, app data folder and update address),
# and a push to dev publishes it as the prerelease v<X.Y.Z-beta.N>. Installed
# stable apps never see a beta: they ask for releases/latest, which GitHub
# never resolves to a prerelease. Beta apps ask the beta-channel release, which
# only ever holds the latest.json of the newest beta.
#
# These checks only block a merge because main's and dev's rulesets
# ("protect" and "protect-dev", under Settings → Rules) require test, desktop,
# version and the four package checks. A job renamed here must be renamed
# there too, or no pull request can
# be merged. The jobs that write ask for contents: write. The package jobs
# also need the repo secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD: they sign the updates installed apps
# download, and installed apps refuse an update signed with any other key.
#
# Jobs never hand files to each other as workflow artifacts: artifact storage
# is a quota shared by every private repo on the account, and other repos
# filling it once failed a release here. The card cache travels through
# actions/cache (a separate per-repo limit) and each package job uploads its
# installers straight to the Release, whose files don't count toward the quota.
# Pushes to other branches run nothing: building four installers on every
# commit cost too much. Pull requests get no push run either, which would test
# every commit twice and give the pull request two checks of each name. No
# tags, so the tag a release creates doesn't start another run.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels an older run on the same branch or pull request (its ref
# is refs/pull/<n>/merge), except on main and dev, where
# that would leave a release half-published. GitHub still keeps only one
# waiting run per branch: if three merges land during one run, the middle one
# gets no release of its own, and the next release includes its changes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

env:
  # beta for pull requests into dev (base_ref) and for pushes and manual runs
  # on dev (ref_name); stable for everything else.
  CHANNEL: ${{ (github.base_ref || github.ref_name) == 'dev' && 'beta' || 'stable' }}
  NODE_VERSION: "24"
  # Collects the Rust crates' licenses for THIRD_PARTY_NOTICES.txt. Pinned, so
  # a new release can't change what the build accepts.
  CARGO_ABOUT_VERSION: "0.9.2"

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      card-cache-key: ${{ steps.card-cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - name: Test the Claude Code hook that guards main
        run: .claude/hooks/guard-main.test.sh
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The socket integration tests, the browser tests and the executable
      # smoke tests resolve cards against the Scryfall card cache. Download
      # it at most once a week instead of on every run. Bump the version after
      # a card DB schema change, so tests don't run against a cache without it.
      - name: Compute card cache key
        id: card-cache-key
        shell: bash
        run: echo "key=cards-v3-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore card cache
        id: card-cache
        uses: actions/cache@v6
        with:
          path: server/data/cards.sqlite3
          key: ${{ steps.card-cache-key.outputs.key }}
          # Lets the Windows package job restore the cache saved here on Linux.
          enableCrossOsArchive: true
      - name: Download card cache
        if: steps.card-cache.outputs.cache-hit != 'true'
        run: npm run import-cards --workspace server

      - run: npm run build:shared
      - run: npm run typecheck --workspace server
      - run: npm run typecheck --workspace e2e
      - run: npm run lint --workspace client
      - run: npm run build --workspace server
      - run: npm run build --workspace client

      # node --test reports "tests 0" and still exits 0 when it finds no
      # test files (e.g. on an older Node), so check that tests actually ran.
      - name: Server tests
        shell: bash
        run: |
          npm test 2>&1 | tee test-output.txt
          if ! grep -Eq "^ℹ tests [1-9]" test-output.txt; then
            echo "::error::npm test ran no tests"
            exit 1
          fi

      - run: npx --workspace e2e playwright install --with-deps chromium
      - run: npm run test:e2e
      # Only uploaded when the browser tests fail. A full artifact quota
      # (see the top of this file) mustn't hide the real failure.
      - name: Upload browser test report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Lints the Rust code and checks its licenses before the package jobs spend
  # time building on four platforms. tauri.conf.json alone needs no
  # server executable: the bundle-only settings that do are in
  # tauri.bundle.conf.json, which only the package jobs use.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace desktop
      - name: Install the Linux libraries Tauri builds against
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      # Fails when a crate's license isn't in about.toml's accepted list, so a
      # new dependency's license is checked here rather than at release time.
      # rust-cache keeps ~/.cargo/bin, so this only compiles on a cache miss.
      # The version goes in as an expression, not $CARGO_ABOUT_VERSION: on
      # Windows run steps use PowerShell, where that came out empty.
      - run: cargo install --locked --features cli "cargo-about@${{ env.CARGO_ABOUT_VERSION }}"
      - name: Check the Rust crates' licenses
        working-directory: desktop/src-tauri
        run: cargo about generate --fail --locked --config about.toml --manifest-path Cargo.toml about.hbs > /dev/null

  # Compares against the highest published release, not the previous commit:
  # a merge that forgot the bump must fail even if an older commit had one.
  # Stable versions are plain X.Y.Z, betas X.Y.Z-beta.N. sort -V only compares
  # them correctly within one form, so each is compared with its own kind, and
  # a beta's X.Y.Z with the latest stable release: 1.5.0-beta.1 comes before
  # 1.5.0, so a beta numbered at or below a stable release would be wrong.
  version:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version was increased
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version package.json)

          # Fetched on its own line so a failed API call fails the step
          # instead of looking like a repo without releases. Betas add many
          # releases, so look further back than the newest few.
          tags=$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')
          # The highest release whose tag matches the pattern, without the v.
          latest_of() { printf '%s\n' "$tags" | grep -E "$1" | sed 's/^v//' | sort -V | tail -n 1 || true; }
          # Whether $1 is higher than $2.
          is_higher() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | tail -n 1)" = "$1" ]; }
          stable=$(latest_of '^v[0-9]+\.[0-9]+\.[0-9]+$')

          if [ "$CHANNEL" = "beta" ]; then
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              echo "::error::The version in package.json (\"$version\") must look like 1.2.3-beta.0 on dev. Start the betas with: npm version preminor --preid beta --no-git-tag-version"
              exit 1
            fi
            if [ -n "$stable" ] && ! is_higher "${version%-beta.*}" "$stable"; then
              echo "::error::Beta $version comes before the latest release v$stable. Start the next betas with: npm version preminor --preid beta --no-git-tag-version"
              exit 1
            fi
            beta=$(latest_of '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$')
            if [ -n "$beta" ] && ! is_higher "$version" "$beta"; then
              echo "::error::Version $version in package.json is not higher than the latest beta v$beta. Bump it with: npm version prerelease --preid beta --no-git-tag-version"
              exit 1
            fi
            echo "Beta $version is higher than the latest release v${stable:-none} and the latest beta v${beta:-none}."
          else
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # A beta version usually means dev is being merged into main.
              echo "::error::The version in package.json (\"$version\") must look like 1.2.3. From a beta, npm version patch --no-git-tag-version turns 1.2.3-beta.4 into 1.2.3."
              exit 1
            fi
            if [ -n "$stable" ]; then
              if ! is_higher "$version" "$stable"; then
                echo "::error::Version $version in package.json is not higher than the latest release v$stable. Bump it with: npm version patch --no-git-tag-version"
                exit 1
              fi
              echo "Version $version is higher than the latest release v$stable."
            else
              echo "No release yet; version $version will be the first."
            fi
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  # Created as a draft so nobody sees a half-filled release; publish-release
  # makes it public once every executable is attached. Publishing it creates
  # the tag on the merged commit. A beta is a prerelease, which GitHub never
  # makes the latest release, so stable apps can't update to it.
  create-release:
    needs: [test, desktop, version]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # "Re-run all jobs" after a failed package job finds the draft from the
      # first attempt; reuse it instead of failing on the existing release.
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" = "true" ]; then
              echo "Reusing the draft release $TAG."
              exit 0
            fi
            echo "::error::Release $TAG is already published."
            exit 1
          fi
          channel_flags=()
          if [ "$CHANNEL" = "beta" ]; then channel_flags=(--prerelease --latest=false); fi
          gh release create "$TAG" --draft "${channel_flags[@]}" --target "$GITHUB_SHA" --generate-notes

  package:
    needs: [test, desktop, version, create-release]
    # create-release only runs on pushes; a pull request or manual run builds
    # without it, and the "Attach to the release" step below is skipped.
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.desktop.result == 'success' &&
      (needs.create-release.result == 'success' || github.event_name != 'push')
    # Fixed names, because the rulesets require these checks by name.
    name: package (${{ matrix.target }})
    # The server executable is a copy of the runner's own Node binary, and the
    # desktop app wraps it, so every platform is built on that platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            bundles: appimage,deb
          - os: windows-latest
            target: windows-x64
            bundles: nsis
          # "app" too: built only as a step towards the dmg, the .app is
          # deleted afterwards, and the smoke test below needs it.
          - os: macos-latest
            target: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            target: macos-x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:exe

      - name: Restore card cache
        id: card-cache
        uses: actions/cache/restore@v6
        with:
          path: server/data/cards.sqlite3
          key: ${{ needs.test.outputs.card-cache-key }}
          enableCrossOsArchive: true
      # Only if the cache was evicted between the jobs.
      - name: Download card cache
        if: steps.card-cache.outputs.cache-hit != 'true'
        run: npm run import-cards --workspace server

      - name: Smoke-test the executable
        shell: bash
        run: |
          exe="release/draft-simulator-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          npm run smoke-test-exe --workspace server -- "$exe" server/data/cards.sqlite3

      - name: Install the Linux libraries Tauri builds against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo install --locked --features cli "cargo-about@${{ env.CARGO_ABOUT_VERSION }}"
      # The server's notices from build:exe plus the Rust crates' licenses.
      - run: npm run notices --workspace desktop
      # build:exe already put the executable where the desktop app bundles it.
      # tauri.updater.conf.json adds the signed update bundles; only CI has the key.
      # tauri.beta.conf.json makes it Draft Simulator Beta.
      # On macOS, hdiutil sometimes can't eject the dmg it just built
      # ("couldn't eject disk2 - Resource busy"), which failed the job and left
      # v0.3.17 a draft until someone re-ran it. A re-run passes, so macOS
      # retries, first detaching any dmg the failed attempt left mounted.
      - name: Build the desktop app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          attempts=1
          if [ "$RUNNER_OS" = "macOS" ]; then attempts=3; fi
          for attempt in $(seq "$attempts"); do
            if npm run build --workspace desktop -- \
              --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.updater.conf.json \
              ${{ env.CHANNEL == 'beta' && '--config src-tauri/tauri.beta.conf.json' || '' }} \
              --bundles ${{ matrix.bundles }}; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then exit 1; fi
            echo "::warning::Building the desktop app failed (attempt $attempt of $attempts), trying again."
            for volume in /Volumes/dmg.*; do
              if [ -d "$volume" ]; then hdiutil detach "$volume" -force || true; fi
            done
            sleep 10
          done

      # Tauri signs the server again when it bundles it. Signed with the
      # hardened runtime, V8 couldn't reserve memory and the server crashed
      # at start, while the executable tested above was fine.
      - name: Smoke-test the server inside the app (macOS)
        if: runner.os == 'macOS'
        run: npm run smoke-test-exe --workspace server -- "desktop/src-tauri/target/release/bundle/macos/${{ env.CHANNEL == 'beta' && 'Draft Simulator Beta' || 'Draft Simulator' }}.app/Contents/MacOS/draft-simulator-server" server/data/cards.sqlite3

      # Renamed to names without spaces or version, like the old downloads.
      # THIRD_PARTY_NOTICES.txt is inside every installer; it's also attached
      # on its own, once. Installed apps update from the AppImage, the Windows
      # installer and the .app.tar.gz, each checked against its .sig; the .deb
      # can't update itself. publish-release lists them in latest.json by
      # these names, so renaming one breaks updating for installed apps.
      - name: Collect the installers
        shell: bash
        env:
          BUNDLE: desktop/src-tauri/target/release/bundle
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release/upload
          case "$RUNNER_OS" in
            Linux)
              cp "$BUNDLE"/appimage/*.AppImage "release/upload/draft-simulator-$TARGET.AppImage"
              cp "$BUNDLE"/appimage/*.AppImage.sig "release/upload/draft-simulator-$TARGET.AppImage.sig"
              cp "$BUNDLE"/deb/*.deb "release/upload/draft-simulator-$TARGET.deb"
              cp desktop/src-tauri/THIRD_PARTY_NOTICES.txt release/upload/
              ;;
            Windows)
              cp "$BUNDLE"/nsis/*-setup.exe "release/upload/draft-simulator-$TARGET-setup.exe"
              cp "$BUNDLE"/nsis/*-setup.exe.sig "release/upload/draft-simulator-$TARGET-setup.exe.sig"
              ;;
            macOS)
              cp "$BUNDLE"/dmg/*.dmg "release/upload/draft-simulator-$TARGET.dmg"
              cp "$BUNDLE"/macos/*.app.tar.gz "release/upload/draft-simulator-$TARGET.app.tar.gz"
              cp "$BUNDLE"/macos/*.app.tar.gz.sig "release/upload/draft-simulator-$TARGET.app.tar.gz.sig"
              ;;
          esac
          ls -l release/upload

      # --clobber, so re-running a failed job replaces a partial upload.
      - name: Attach to the release
        if: needs.create-release.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" release/upload/* --clobber

  publish-release:
    needs: [version, create-release, package]
    if: needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Installed apps fetch releases/latest/download/latest.json at start
      # (betas: beta-channel's copy, see the last step). Attached while the
      # release is still a draft, so it only ever lists files that are
      # already there.
      - name: Attach latest.json for the updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir sigs
          gh release download "$TAG" --pattern '*.sig' --dir sigs
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          # The updater's platform name, then the file it installs.
          platforms='{}'
          for entry in \
            "darwin-aarch64 draft-simulator-macos-arm64.app.tar.gz" \
            "darwin-x86_64 draft-simulator-macos-x64.app.tar.gz" \
            "windows-x86_64 draft-simulator-windows-x64-setup.exe" \
            "linux-x86_64 draft-simulator-linux-x64.AppImage"; do
            read -r platform file <<< "$entry"
            if [ ! -s "sigs/$file.sig" ]; then
              echo "::error::Release $TAG has no $file.sig, so latest.json can't offer $platform an update."
              exit 1
            fi
            # $(cat) drops a trailing newline, which isn't part of the signature.
            platforms=$(jq --arg platform "$platform" --arg url "$base/$file" --arg signature "$(cat "sigs/$file.sig")" \
              '.[$platform] = {url: $url, signature: $signature}' <<< "$platforms")
          done
          jq -n --arg version "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            '{version: $version, pub_date: $date, platforms: $platforms}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      # GitHub lists a release's files alphabetically, with each .sig next to
      # its installer, so the notes start with a link to each installer.
      # The marker keeps a re-run from adding the table twice.
      - name: Add download links to the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          marker="<!-- downloads -->"
          body=$(gh release view "$TAG" --json body --jq .body)
          if [[ "$body" == "$marker"* ]]; then
            echo "The release notes already list the downloads."
            exit 0
          fi
          # The computer it's for, then the file to download.
          installers=(
            "Windows|draft-simulator-windows-x64-setup.exe"
            "Mac with Apple Silicon (M1 and newer)|draft-simulator-macos-arm64.dmg"
            "Intel Mac|draft-simulator-macos-x64.dmg"
            "Linux|draft-simulator-linux-x64.AppImage"
            "Linux (Debian, Ubuntu)|draft-simulator-linux-x64.deb"
          )
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for entry in "${installers[@]}"; do
            if ! grep -qxF "${entry#*|}" <<< "$assets"; then
              echo "::error::Release $TAG has no ${entry#*|} to link to."
              exit 1
            fi
          done
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          {
            echo "$marker"
            echo "## Downloads"
            echo
            echo "| Computer | Installer |"
            echo "|---|---|"
            for entry in "${installers[@]}"; do
              IFS="|" read -r computer file <<< "$entry"
              echo "| $computer | [$file]($base/$file) |"
            done
            echo
            echo "See the [README](https://github.com/$GH_REPO#download-and-run) for installing and the first-start warnings. Installed apps update themselves from most of the other files below."
            echo
            if [ "$CHANNEL" = "beta" ]; then
              echo "**This is a beta.** It installs as Draft Simulator Beta, next to the normal app, with its own drafts and settings, and only updates to newer betas. See [Beta versions](https://github.com/$GH_REPO#beta-versions)."
              echo
            fi
            echo "$body"
          } > notes.md
          cat notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

      # Installed betas fetch beta-channel's latest.json, so it moves only
      # once the beta it lists is public. beta-channel must stay a
      # prerelease: as the latest release, stable apps would install betas.
      - name: Point beta apps at this beta
        if: env.CHANNEL == 'beta'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          channel=beta-channel
          if is_prerelease=$(gh release view "$channel" --json isPrerelease --jq .isPrerelease 2>/dev/null); then
            if [ "$is_prerelease" != "true" ]; then
              echo "::error::Release $channel isn't a prerelease, so stable apps could update to a beta. Mark it as a pre-release on GitHub."
              exit 1
            fi
          else
            gh release create "$channel" --prerelease --latest=false --target "$GITHUB_SHA" --title "Beta channel" \
              --notes "Holds latest.json for installed betas of Draft Simulator, which they check for updates. The betas themselves are the v*-beta.* releases."
          fi
          gh release upload "$channel" latest.json --clobber

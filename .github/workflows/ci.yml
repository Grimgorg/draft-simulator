name: CI

# Tests run on every push to main and every pull request. Pushing a version
# tag (v1.2.3) also builds the executables for every platform and publishes
# them on a GitHub Release, but only once the tests have passed. A manual run
# (Actions → CI → Run workflow) builds and smoke-tests the executables without
# releasing them.
#
# Jobs never hand files to each other as workflow artifacts: artifact storage
# is a quota shared by every private repo on the account, and other repos
# filling it once failed a release here. The card cache travels through
# actions/cache (a separate per-repo limit) and each package job uploads its
# executable straight to the Release, whose files don't count toward the quota.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: "24"

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      card-cache-key: ${{ steps.card-cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The socket integration tests, the browser tests and the executable
      # smoke tests resolve cards against the Scryfall card cache. Download
      # it at most once a week instead of on every run. Bump the version after
      # a card DB schema change, so tests don't run against a cache without it.
      - name: Compute card cache key
        id: card-cache-key
        shell: bash
        run: echo "key=cards-v2-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore card cache
        id: card-cache
        uses: actions/cache@v6
        with:
          path: server/data/cards.sqlite3
          key: ${{ steps.card-cache-key.outputs.key }}
          # Lets the Windows package job restore the cache saved here on Linux.
          enableCrossOsArchive: true
      - name: Download card cache
        if: steps.card-cache.outputs.cache-hit != 'true'
        run: npm run import-cards --workspace server

      - run: npm run build:shared
      - run: npm run typecheck --workspace server
      - run: npm run typecheck --workspace e2e
      - run: npm run lint --workspace client
      - run: npm run build --workspace server
      - run: npm run build --workspace client

      # node --test reports "tests 0" and still exits 0 when it finds no
      # test files (e.g. on an older Node), so check that tests actually ran.
      - name: Server tests
        shell: bash
        run: |
          npm test 2>&1 | tee test-output.txt
          if ! grep -Eq "^ℹ tests [1-9]" test-output.txt; then
            echo "::error::npm test ran no tests"
            exit 1
          fi

      - run: npx --workspace e2e playwright install --with-deps chromium
      - run: npm run test:e2e
      # Only uploaded when the browser tests fail. A full artifact quota
      # (see the top of this file) mustn't hide the real failure.
      - name: Upload browser test report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Created as a draft so nobody sees a half-filled release; publish-release
  # makes it public once every executable is attached.
  create-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A tag with a suffix (v1.0.0-rc.1) becomes a pre-release.
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" --draft --verify-tag --generate-notes $prerelease

  package:
    needs: [test, create-release]
    # create-release is skipped on a manual run; still build then.
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch')
    # The executable is a copy of the runner's own Node binary, so every
    # platform is built on that platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:exe

      - name: Restore card cache
        id: card-cache
        uses: actions/cache/restore@v6
        with:
          path: server/data/cards.sqlite3
          key: ${{ needs.test.outputs.card-cache-key }}
          enableCrossOsArchive: true
      # Only if the cache was evicted between the jobs.
      - name: Download card cache
        if: steps.card-cache.outputs.cache-hit != 'true'
        run: npm run import-cards --workspace server

      - name: Smoke-test the executable
        shell: bash
        run: |
          exe="release/draft-simulator-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          npm run smoke-test-exe --workspace server -- "$exe" server/data/cards.sqlite3

      # Archived so the executable bit survives the download on macOS and Linux.
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release/draft-simulator-${{ matrix.target }}.exe -DestinationPath release/draft-simulator-${{ matrix.target }}.zip
      - name: Archive (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          # Keeps macOS tar from adding ._ metadata files to the archive.
          COPYFILE_DISABLE: "1"
        run: tar -czf release/draft-simulator-${{ matrix.target }}.tar.gz -C release draft-simulator-${{ matrix.target }}

      # --clobber, so re-running a failed job replaces a partial upload.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: release/draft-simulator-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber

  publish-release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
